<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Conteo de Inventario - Hares de México</title>
    <link rel="icon" type="image/svg+xml" href="img/HARES_icono_tinta.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none !important; }
        html, body { -webkit-tap-highlight-color: transparent; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/tema-base.css">
    <link rel="stylesheet" href="css/ui-moderno.css">
    <script>
        /* mismo tema que eligió el usuario en la app (Configuración > Tema de colores) */
        try { document.documentElement.setAttribute('data-theme', localStorage.getItem('hares_tema') || 'aurora'); } catch (e) {}
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="app" class="min-h-screen"></div>
    <!-- Carga los módulos con versión (cargador.js + version.json) para no quedarse con .js viejos en caché -->
    <script src="cargador.js" data-entrada="js/conteo-inventario.js"></script>
</body>
</html>
